name: Deploy roadmap to GitHub Pages

on:
  push:
    branches: [main]
  # Progress lives in GitHub milestones, issues and the org project, none of
  # which can trigger this workflow directly, so rebuild on a schedule too.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [roadmap-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch roadmap from GitHub
        env:
          # GITHUB_TOKEN can read public milestones and issues but not org
          # projects; a ROADMAP_TOKEN secret with project read access adds statuses.
          ROADMAP_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run fetch-roadmap

      - name: Validate roadmap.json
        run: npm run validate

      - name: Build
        # Served from a custom domain (roadmap.hoardcti.com) at the root, so
        # BASE_PATH is left unset.
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
